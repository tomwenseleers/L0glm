url: https://tomwenseleers.github.io/L0glm/
title: L0glm
llm-docs: false
repo:
  url:
    home: https://github.com/tomwenseleers/L0glm/
    source: https://github.com/tomwenseleers/L0glm/blob/master/L0glm/
    issue: https://github.com/tomwenseleers/L0glm/issues
    user: https://github.com/
destination: ../docs
template:
  bootstrap: 5
  math-rendering: katex
  theme: github-dark
  bslib:
    bg: "#fcfdfd"
    fg: "#203047"
    primary: "#087e83"
    secondary: "#dbe9ef"
    base_font: "system-ui"
    heading_font: "system-ui"
    code_font: "Consolas"
    border-radius: 0.6rem
    navbar-bg: "#081629"
    navbar-dark-color: "#d7edf3"
  opengraph:
    image:
      src: man/figures/logo.png
      alt: L0glm hex logo with selected coefficient rows across response channels
home:
  strip_header: false # Removed after logo insertion in pkgdown/build.R.
  title: "L0glm: Scalable L₀ and Grouped L₀-Penalized Variable Selection for Generalized Linear Models"
  description: >
    Fast L0 and grouped L0 regression for GLMs, negative binomial,
    multinomial and Cox models. Sparse or dense data, SIS/ISIS screening,
    cross-validation, native OpenMP and reproducible benchmarks in R.
  sidebar:
    structure: [links, citation, authors, license]
authors:
  sidebar:
    roles: [aut, cre, ctb]
navbar:
  bg: dark
  type: dark
  structure:
    left: [intro, tutorials, algorithm, performance, reference, news]
    right: [search, github]
  components:
    intro:
      text: Get started
      href: articles/L0glm.html
    tutorials:
      text: Tutorials
      menu:
        - text: Model selection and cross-validation
          href: articles/selection.html
        - text: Weights, constraints and validation
          href: articles/controls.html
        - text: Groups of predictors
          href: articles/predictor-groups.html
        - text: Interaction effects
          href: articles/interactions.html
        - text: Coefficient inference
          href: articles/inference.html
        - text: "---"
        - text: Regular GLM models
          href: articles/regular-glm.html
        - text: Negative binomial models
          href: articles/negative-binomial.html
        - text: Multinomial models
          href: articles/multinomial.html
        - text: Cox proportional hazards models
          href: articles/cox.html
        - text: SIS / ISIS screening for high dimensional models
          href: articles/high-dimensional.html
        - text: File-backed data and GWAS
          href: articles/file-backed.html
        - text: "---"
        - text: Single and multichannel deconvolution
          href: articles/deconvolution.html
    algorithm:
      text: Algorithm & theory
      href: articles/algorithm.html
    performance:
      text: Benchmarks
      href: articles/performance.html
    github:
      icon: fab fa-github
      href: https://github.com/tomwenseleers/L0glm
      aria-label: Source code on GitHub
articles:
  - title: Get started
    contents: [L0glm, articles/selection, articles/controls, articles/predictor-groups, articles/interactions, articles/inference]
  - title: Model families
    contents: [articles/regular-glm, articles/negative-binomial, articles/multinomial, articles/cox]
  - title: Screening at scale
    contents: [articles/high-dimensional, articles/file-backed]
  - title: Algorithms and evidence
    contents: [articles/algorithm, articles/performance]
  - title: Applications
    contents: [articles/deconvolution]
reference:
  - title: Fit, tune and compare sparse models
    contents: [l0glmFit, l0glmTune, l0nnPois, sparseGLM, l0glmMetrics, preclustering, compulsory_terms, predictor_groups, interaction_models, local_search]
  - title: Predictions, summaries and information criteria
    contents: [model_predictions, model_summary, coefficient_inference, model_criteria, information_criteria, presetLambda]
  - title: Special families
    contents: [extended_families, L0glm_negative_binomial, L0glm_multinomial, L0glm_cox]
  - title: Screening, simulations and solvers
    contents: [sisGLM, l0glmData, simul, simulateSpikeTrain, lmRidge, controlSolverGen]
  - title: Signal noise and dispersion
    contents: [signal_families, temporalDispersion]
  - title: Visualization and outcome clustering
    contents: [plotMat, plotL0glmBenchmark, glmCluster, glmDist]
  - title: Example data
    contents: [simulatedSpectra]
  - title: Likelihood adapters
    contents: [logLik.glmnet, logLik.L0Learn, logLik.L0glm_extended_fit]
footer:
  structure:
    left: developed_by
    right: [built_with, source]
  components:
